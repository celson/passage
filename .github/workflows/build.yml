name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'age-mobile/**'
      - 'android/**'
      - '.github/workflows/build.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running build of the same ref (tags are never cancelled)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build Native Age Engine & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build never pushes; do not leave the token in .git/config for later steps
          persist-credentials: false

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & Licenses
        run: |
          # Accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Match ANDROID_NDK_HOME with runner's ANDROID_NDK_ROOT or detect
          if [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          else
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Selected NDK: $NDK_PATH"

      - name: Set up Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache-workspaces: age-mobile
          target: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Test Native Age Engine
        working-directory: age-mobile
        run: cargo test --locked

      # Tags ship every ABI; other builds only the ones real devices use
      - name: Compile Native .so Libraries for Android
        working-directory: age-mobile
        env:
          ABIS: ${{ startsWith(github.ref, 'refs/tags/v') && 'arm64-v8a armeabi-v7a x86_64 x86' || 'arm64-v8a armeabi-v7a' }}
        run: |
          chmod +x build-android.sh
          ./build-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The real keystore is only for pushes to main / v* tags. Pull requests and manual runs
      # on other refs always get the throwaway one, even when secrets are available.
      # Passwords never go to $GITHUB_ENV: only the Gradle step below receives them.
      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_RELEASE_REF: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/keystore/release.keystore"
          if [ "$IS_RELEASE_REF" = "true" ]; then
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Official release builds must use repository secrets."
              exit 1
            fi
            echo "Using release keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "alias=" >> "$GITHUB_OUTPUT"
          else
            echo "Generating ephemeral keystore for CI test build"
            RANDOM_PASS=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
            echo "::add-mask::$RANDOM_PASS"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "ci-test" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass "$RANDOM_PASS" \
              -keypass "$RANDOM_PASS" \
              -dname "CN=Passage CI Test, OU=CI, O=Passage, L=Test, ST=Test, C=US"
            echo "mode=ci" >> "$GITHUB_OUTPUT"
            echo "alias=ci-test" >> "$GITHUB_OUTPUT"
            echo "ci_password=$RANDOM_PASS" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Build Signed Android Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.mode == 'release' && secrets.ANDROID_KEYSTORE_PASSWORD || steps.keystore.outputs.ci_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.mode == 'release' && secrets.ANDROID_KEY_ALIAS || steps.keystore.outputs.alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.mode == 'release' && secrets.ANDROID_KEY_PASSWORD || steps.keystore.outputs.ci_password }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../dist-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/Passage.apk
          else
            echo "Error: app-release.apk not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Passage-Android-APK
          path: dist-apk/Passage.apk
          retention-days: 30

      - name: Remove Signing Keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

  # Separate job so the write token never shares a runner with the keystore secrets or the build
  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Passage-Android-APK
          path: dist-apk

      # Rolling build of main, published as a prerelease with make_latest: false so it
      # never takes the "Latest" badge from versioned v* releases.
      - name: Publish or Update Rolling Main Build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: Passage (development build - main)
          body: |
            Signed **release** APK built automatically on every push to `main`.
            For stable versions, use the [latest official release](https://github.com/${{ github.repository }}/releases/latest).
          files: dist-apk/Passage.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist-apk/Passage.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
